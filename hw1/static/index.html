<!doctype html><html lang="ru"><meta charset="utf-8"><title>Выдача книг</title>
<style>body{font:16px system-ui;max-width:1000px;margin:30px auto}input,button,select{padding:8px;margin:4px}pre{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{padding:8px;border:1px solid #bbb}
body {
  background:#f4f6fa;
  color:#243047;
  padding:20px;
  line-height:1.5;
}
h1,h2,h3 { color:#182943; }
input,select {
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:white;
}
button {
  background:#2563eb;
  color:white;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
button:hover { background:#1d4ed8; }
.card {
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px #1829430d;
  margin:12px 0;
}
table { background:white; }
td,th {
  border:0;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}
th { background:#edf2f8; }
.details th { width:40%; }
.metrics {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.metric {
  background:white;
  border-radius:12px;
  padding:20px;
  flex:1;
  min-width:180px;
}
.metric span { display:block; color:#64748b; }
.metric strong {
  display:block;
  font-size:36px;
  color:#2563eb;
}
.warning strong { color:#b45309; }
.badge {
  display:inline-block;
  padding:5px 12px;
  border-radius:20px;
  margin-bottom:12px;
}
.active { background:#dbeafe; color:#1d4ed8; }
.returned { background:#dcfce7; color:#166534; }
#message { color:#b91c1c; font-weight:600; }
</style>
<h1>Библиотека — вариант 1</h1><p>Учётная запись: librarian. Пароль из API_PASSWORD.</p>
<input id="password" type="password" placeholder="Пароль"><button onclick="load()">Войти / обновить</button>
<h2>Выдать экземпляр</h2><input id="reader" type="number" min="1" placeholder="ID читателя"><input id="copy" type="number" min="1" placeholder="ID экземпляра"><button onclick="issue()">Выдать на 14 дней</button>
<h2>Выдачи</h2><select id="status"><option value="all">Все</option><option value="active">На руках</option><option value="overdue">Просрочены</option><option value="returned">Возвращены</option></select><button onclick="page=1;load()">Фильтр</button>
<div id="list"></div><button onclick="page=Math.max(1,page-1);load()">Назад</button><span id="position"></span><button onclick="if(page*20<total){page++;load()}">Вперёд</button>
<h2>Карточка выдачи</h2><div id="detail">Выберите выдачу из списка.</div><h2>Сводка</h2><div id="summary"></div><p id="message" role="alert"></p>
<script>

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[char]);
}

function formatDate(value) {
  if (!value) return '—';
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? String(value)
    : date.toLocaleDateString('ru-RU', {timeZone:'UTC'});
}

function renderDetail(data) {
  const returned = Boolean(data.returned_on);
  const rows = [
    ['Номер выдачи', data.id],
    ['Читатель', data.reader ?? data.reader_id],
    ['Книга', data.book ?? 'Откройте карточку из списка'],
    ['Экземпляр', data.copy_id],
    ['Дата выдачи', formatDate(data.issued_on)],
    ['Вернуть до', formatDate(data.due_on)],
    ['Дата возврата', formatDate(data.returned_on)]
  ];

  if (data.fine_rub !== undefined) {
    rows.push(['Начисленный штраф', data.fine_rub + ' ₽']);
  }

  return `
    <div class="card">
      <span class="badge ${returned ? 'returned' : 'active'}">
        ${returned ? 'Возвращено' : 'На руках'}
      </span>
      <table class="details">
        ${rows.map(([label,value]) => `
          <tr>
            <th>${escapeHtml(label)}</th>
            <td>${escapeHtml(value)}</td>
          </tr>`).join('')}
      </table>
    </div>`;
}

function renderSummary(data) {
  return `
    <div class="metrics">
      <div class="metric">
        <span>Экземпляров на руках</span>
        <strong>${escapeHtml(data.on_hands)}</strong>
      </div>
      <div class="metric warning">
        <span>Просроченных выдач</span>
        <strong>${escapeHtml(data.overdue)}</strong>
      </div>
    </div>
    <div class="card">
      <h3>Популярные книги</h3>
      <table>
        <thead><tr><th>Книга</th><th>Всего выдач</th></tr></thead>
        <tbody>
          ${data.top_books.map(book => `
            <tr>
              <td>${escapeHtml(book.title)}</td>
              <td>${escapeHtml(book.issued)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

let page=1,total=0; const el=id=>document.getElementById(id);
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,cache:'no-store',headers:{Authorization:'Basic '+btoa('librarian:'+el('password').value),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function safe(fn){try{el('message').textContent='';await fn()}catch(e){el('message').textContent=e.message}}
function load(){return safe(async()=>{const d=await api('loans?page='+page+'&size=20&status='+el('status').value);total=d.total;el('position').textContent=`Страница ${page}, всего ${total}`;const table=document.createElement('table');table.innerHTML='<tr><th>ID</th><th>Читатель</th><th>Экземпляр</th><th>Срок</th><th>Действия</th></tr>';for(const x of d.items){const tr=table.insertRow();for(const v of [x.id,x.reader_id,x.copy_id,formatDate(x.due_on)])tr.insertCell().textContent=v;const td=tr.insertCell();const b=document.createElement('button');b.textContent='Карточка';b.onclick=()=>safe(async()=>el('detail').innerHTML=renderDetail(await api('loans/'+x.id)));td.append(b);if(!x.returned_on){const ret=document.createElement('button');ret.textContent='Возврат';ret.onclick=()=>safe(async()=>{el('detail').innerHTML=renderDetail(await api('loans/'+x.id+'/return','POST'));await load()});td.append(ret)}}el('list').replaceChildren(table);el('summary').innerHTML=renderSummary(await api('summary'))})}
function issue(){return safe(async()=>{el('detail').innerHTML=renderDetail(await api('loans','POST',{reader_id:Number(el('reader').value),copy_id:Number(el('copy').value),days:14}));await load()})}
</script></html>
